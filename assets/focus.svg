<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="t">
  <title id="t">Current focus - React Native at Fanavaran</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050E24"/>
      <stop offset="1" stop-color="#12285A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8D16A"/>
      <stop offset="1" stop-color="#E59A12"/>
    </linearGradient>
    <clipPath id="r"><rect width="1200" height="280" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect x="0" y="0" width="3" height="280" fill="#F0B429" fill-opacity="0.9"/>
    <rect x="0" y="0" width="1200" height="1" fill="#F0B429" fill-opacity="0.25"/>

    <text x="40" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2.8" fill="#F0B429">CURRENT FOCUS  |  NOT FULLY REFLECTED IN PUBLIC GITHUB STATS</text>
    <text x="40" y="100" font-family="Georgia, Times New Roman, serif" font-size="36" font-weight="700" fill="#FFFFFF">React Native at Fanavaran</text>
    <text x="40" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#DCE5FF">Rebuilding the Android &amp; iOS app - courses, live classes, payments, certificates.</text>
    <text x="40" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9FB1E3">Also shipping the Fanavaran CLI, website and backend. Most of this work lives in private / company repos.</text>

    <!-- skill bars (honest relative focus weights, labeled as focus not GitHub %) -->
    <text x="40" y="208" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#F8D16A">FOCUS MIX (CAREER)</text>

    <text x="40" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#DCE5FF">React Native</text>
    <rect x="160" y="224" width="420" height="12" rx="6" fill="#1E3270"/>
    <rect x="160" y="224" width="360" height="12" rx="6" fill="url(#gold)"/>

    <text x="620" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#DCE5FF">TypeScript / Node</text>
    <rect x="780" y="224" width="360" height="12" rx="6" fill="#1E3270"/>
    <rect x="780" y="224" width="250" height="12" rx="6" fill="url(#gold)"/>

    <text x="40" y="266" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#DCE5FF">Laravel / Vue</text>
    <rect x="160" y="254" width="420" height="12" rx="6" fill="#1E3270"/>
    <rect x="160" y="254" width="220" height="12" rx="6" fill="url(#gold)"/>

    <text x="620" y="266" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#DCE5FF">Flutter</text>
    <rect x="780" y="254" width="360" height="12" rx="6" fill="#1E3270"/>
    <rect x="780" y="254" width="200" height="12" rx="6" fill="url(#gold)"/>
  </g>
</svg>
