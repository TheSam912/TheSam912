<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="t">
  <title id="t">Now - React Native at Fanavaran</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050E24"/>
      <stop offset="1" stop-color="#12285A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8D16A"/>
      <stop offset="1" stop-color="#E59A12"/>
    </linearGradient>
    <clipPath id="r"><rect width="1200" height="240" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="240" fill="url(#bg)"/>
    <rect x="0" y="0" width="3" height="240" fill="#F0B429"/>
    <text x="40" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="3" fill="#F0B429">NOW SHIPPING</text>
    <text x="40" y="100" font-family="Georgia, Times New Roman, serif" font-size="38" font-weight="700" fill="#FFFFFF">React Native at Fanavaran</text>
    <text x="40" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#DCE5FF">Rebuilding the Android &amp; iOS learning app - courses, live classes, payments, certificates.</text>
    <text x="40" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9FB1E3">Plus CLI, website and backend. Live on Google Play.</text>
    <rect x="40" y="198" width="110" height="22" rx="5" fill="#F0B429" fill-opacity="0.14"/>
    <text x="50" y="213" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#F8D16A">React Native</text>
    <rect x="160" y="198" width="58" height="22" rx="5" fill="#F0B429" fill-opacity="0.14"/>
    <text x="170" y="213" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#F8D16A">Expo</text>
    <rect x="228" y="198" width="70" height="22" rx="5" fill="#F0B429" fill-opacity="0.14"/>
    <text x="238" y="213" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#F8D16A">TypeScript</text>
    <rect x="308" y="198" width="68" height="22" rx="5" fill="#F0B429" fill-opacity="0.14"/>
    <text x="318" y="213" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#F8D16A">Node.js</text>
  </g>
</svg>
