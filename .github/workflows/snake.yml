name: Contribution snake

on:
  schedule:
    - cron: "17 3 * * *" # every day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake (light + dark, navy/gold)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#E59A12&color_dots=#ebedf0,#c9d6f5,#8fa8e8,#3d5bb8,#13235e
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F0B429&color_dots=#161b22,#1e3270,#2b4ba8,#5b8cff,#c9d6f5

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
